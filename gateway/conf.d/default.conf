# 외부 공개용 게이트웨이. 데모에 필요한 API 만 열고 나머지는 차단한다.

# IP 당 요청 제한 (LLM 호출은 공용 GPU 를 쓰므로 엄격하게)
limit_req_zone $binary_remote_addr zone=llm_per_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
# 전체 동시 LLM 호출 수 제한 (IP 무관)
limit_conn_zone $server_name zone=llm_total:1m;

limit_req_status 429;

# 도커 내장 DNS. 컨테이너가 재생성돼 IP 가 바뀌어도 주기적으로 다시 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 기간계 2대 로드밸런싱 (라운드로빈). resolve: IP 변경 추적(nginx 1.27.3+)
# 한 대가 응답하지 않으면 5초간 제외(passive health check)하고 다른 대로 보낸다.
upstream core_backend {
    zone core_backend 64k;
    server core-a:8080 resolve max_fails=1 fail_timeout=5s;
    server core-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 16k;

    # HAProxy(도커 네트워크) 가 넘겨준 실제 클라이언트 IP 사용
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;

    # AI 서비스는 1대: 변수 업스트림 + 위 resolver 로 재조회
    set $ai_upstream http://api:8000;

    location / {
        try_files $uri /index.html;
    }

    # ---------- AI 서비스 (FastAPI) ----------
    location = /ai/chat {
        limit_req zone=llm_per_ip burst=2 nodelay;
        limit_conn llm_total 2;
        proxy_pass $ai_upstream/chat;
        proxy_read_timeout 300s;
    }

    location = /ai/search {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass $ai_upstream/search;
    }

    location = /ai/documents {
        proxy_pass $ai_upstream/documents;
    }

    # ---------- 기간계 (Spring) ----------
    # 운영 관리용 엔드포인트는 비공개
    location /core/actuator { return 404; }

    # 운영 상태(인스턴스·서킷)는 화면 표시용으로 공개
    location = /core/ops/status {
        proxy_set_header Host $host;
        proxy_pass http://core_backend/ops/status;
    }

    location /core/ {
        limit_req zone=api_per_ip burst=50 nodelay;
        rewrite ^/core/(.*)$ /$1 break;
        proxy_pass http://core_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # upstream 이름(core_backend)이 Host 로 전달되면 Tomcat 이 밑줄 때문에 400 으로 거부한다
        proxy_set_header Host $host;
        # 연결 실패·502/503 이면 다른 인스턴스로 재시도 (POST 등은 요청을 보내기 전 실패일 때만)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        add_header X-Ax-Upstream $upstream_addr always;
    }

    # /ai/ingest, /ai/runs 등 나머지 AI 서비스 경로는 비공개
    location /ai/ { return 404; }
}
