services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ax}
      POSTGRES_DB: ${POSTGRES_DB:-ax}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ax} -d ${POSTGRES_DB:-ax}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ax}:${POSTGRES_PASSWORD:-ax}@db:5432/${POSTGRES_DB:-ax}
      POLICY_DIR: /data/policies
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    networks:
      - default
      - llm   # 같은 서버의 Ollama 컨테이너(Docker/Llm)에 접근
    volumes:
      - ./data/policies:/data/policies:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${API_PORT:-8030}:8000"
    depends_on:
      db:
        condition: service_healthy

  core:
    build: ./core
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ax}?currentSchema=core
      DB_USER: ${POSTGRES_USER:-ax}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ax}
      AI_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${CORE_PORT:-8031}:8080"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # 외부 공개 진입점. HAProxy 가 ax_default 네트워크로 이 컨테이너에 붙는다.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8032}:80"
    depends_on:
      - api
      - core

networks:
  llm:
    name: llm_default
    external: true

volumes:
  pgdata:
  hf-cache:
