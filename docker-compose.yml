services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ax}
      POSTGRES_DB: ${POSTGRES_DB:-ax}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ax} -d ${POSTGRES_DB:-ax}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ax}:${POSTGRES_PASSWORD:-ax}@db:5432/${POSTGRES_DB:-ax}
      POLICY_DIR: /data/policies
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    networks:
      - default
      - llm   # 같은 서버의 Ollama 컨테이너(Docker/Llm)에 접근
    volumes:
      - ./data/policies:/data/policies:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${API_PORT:-8030}:8000"
    depends_on:
      db:
        condition: service_healthy

  # 미니 기간계 2대 (게이트웨이가 로드밸런싱). 같은 이미지, 데모 데이터 적재는 core-a 만 한다.
  core-a:
    build: ./core
    image: ax-core:latest
    hostname: core-a
    environment: &core-env
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ax}?currentSchema=core
      DB_USER: ${POSTGRES_USER:-ax}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ax}
      AI_BASE_URL: http://api:8000
      AX_DEMO_ENABLED: "true"
      AX_SEED_ENABLED: ${AX_SEED_ENABLED:-true}
      AX_SEED_CUSTOMERS: ${AX_SEED_CUSTOMERS:-30000}
      AX_SEED_EXTERNAL: ${AX_SEED_EXTERNAL:-50000}
      AX_SEED_CONTRACTS: ${AX_SEED_CONTRACTS:-60000}
      AX_SEED_CLAIMS: ${AX_SEED_CLAIMS:-500000}
    ports:
      - "127.0.0.1:${CORE_PORT:-8031}:8080"
    # readiness: 데이터 적재(ApplicationRunner)까지 끝나야 트래픽을 받는다
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # 롤링 배포 시 처리 중인 요청을 마칠 시간 (Spring graceful shutdown 30s)
    stop_grace_period: 40s
    # AI 서비스(api)에 의존하지 않는다: AI 가 없어도 서킷브레이커 → 수동심사로 업무는 계속된다
    depends_on:
      db:
        condition: service_healthy

  core-b:
    image: ax-core:latest   # core-a 가 빌드한 이미지를 그대로 사용
    hostname: core-b
    environment:
      <<: *core-env
      AX_DEMO_ENABLED: "false"
      AX_SEED_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      core-a:
        condition: service_healthy

  # 외부 공개 진입점. HAProxy 가 ax_default 네트워크로 이 컨테이너에 붙는다.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      # 디렉토리 단위 마운트 (파일 단위는 편집기 저장 시 inode 가 바뀌어 반영 안 됨 — troubleshooting #5)
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8032}:80"
    depends_on:
      - api
      - core-a
      - core-b

networks:
  llm:
    name: llm_default
    external: true

volumes:
  pgdata:
  hf-cache:
